# The installer matches upstream; this fork does not distribute, sign, or release its own installer.
# Manual dispatch does not create a tagged release. Check compatibility separately using upstream procedures.
name: Upstream installer (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Installer distribution is not supported by this fork."
