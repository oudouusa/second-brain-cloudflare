# installer実装は上流と同一だが、このforkは独自の配布・署名・releaseを提供しない。
# 手動実行でもタグreleaseへ進まない。互換性確認は上流の手順で別途実施する。
name: Upstream installer (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsupported:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "このforkのinstaller配布は未対応です。"
