name: Worker CI

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Configure a read-only upstream remote
        run: |
          git remote add upstream https://github.com/rahilp/second-brain-cloudflare.git
          git config remote.upstream.pushurl DISABLED
      - name: Audit fork boundaries and lifecycle scripts before installing dependencies
        # Feature PRs enforce fork boundaries; new upstream commits and merge conflicts
        # are reported only. The scheduled Upstream Audit requires a current upstream base.
        run: npm run upstream:audit:boundary
      - name: Check the public source tree
        run: node scripts/check-publication.mjs
      - name: Dependency audit regression tests (offline)
        run: node --test experiments/dependency-audit/*.test.mjs
      - run: npm ci --legacy-peer-deps
      - name: Prompt Capsule / cache experiment contract
        run: |
          node --test experiments/prompt-cache/*.test.mjs
          node experiments/prompt-cache/session-example.mjs --api responses > /tmp/capsule-session-responses.json
          node experiments/prompt-cache/session-example.mjs --api messages > /tmp/capsule-session-messages.json
          node experiments/prompt-cache/mcp-authorize.mjs --help > /tmp/prompt-cache-mcp-authorize-help.txt
          node experiments/prompt-cache/source-revalidate.mjs --help > /tmp/prompt-capsule-revalidate-help.txt
          node experiments/prompt-cache/qualify.mjs --help > /tmp/prompt-cache-qualify-help.txt
          node experiments/prompt-cache/dev-effect.mjs --help > /tmp/second-brain-dev-effect-help.txt
          node experiments/prompt-cache/ab.mjs --dry-run --arm both --runs 2 --delay-ms 0 > /tmp/prompt-cache-ab.jsonl
          test "$(wc -l < /tmp/prompt-cache-ab.jsonl)" -eq 6
          node experiments/prompt-cache/verify.mjs --input /tmp/prompt-cache-ab.jsonl --gate structure > /tmp/prompt-cache-evidence.json
          node -e 'const m=JSON.parse(require("node:fs").readFileSync("/tmp/prompt-cache-evidence.json","utf8")); if (m.schema !== "prompt-cache-evidence.v1" || m.verified !== true) process.exit(1)'
      - name: Answer quality detector tests (offline)
        run: python3 -B -m unittest discover -s experiments/answer-quality -p 'test_*.py'
      - run: npm run typecheck
      # The "no unscoped corpus query" rule from src/lib/scope.ts, machine-checked.
      # There is no ESLint in this repo; this is a plain Node script.
      #
      # --inventory prints every documented exception beside the alias list the
      # checker itself derived. Off by default (a hundred lines on every local
      # run is noise); on here, so the log keeps a diffable record and a reason
      # drifting away from its SQL shows up in the diff.
      - run: npm run check:scope -- --inventory
      # Vitest defaults to CPUs minus one. Use both CPUs on a two-CPU runner to fit all gates within 15 minutes.
      - run: npm run test:coverage -- --maxWorkers=100%
      # The CPU-budget tests above skip their timing assertions under coverage
      # instrumentation (v8 coverage adds per-call overhead the budgets were
      # never meant to absorb); this re-run, without --coverage, is what
      # actually enforces those budgets on CI.
      - name: Measure CPU budgets without coverage
        run: npx vitest run test/unit/quarantine-cold-cpu.test.ts test/unit/quarantine-score.test.ts test/unit/versions-chain.test.ts
      - name: Isolated nightly SQL diagnostics (offline)
        env:
          NIGHTLY_PROBE_OUTPUT: ${{ runner.temp }}/nightly-perf
        run: npx --no-install vitest run --config experiments/nightly-perf/vitest.config.ts
      - run: npm run benchmark:validate
      - name: Regenerate types with pinned Wrangler 4.x and check for differences
        run: |
          npx --yes wrangler@4.146.0 types
          npx tsc --noEmit
          git diff --exit-code -- worker-configuration.d.ts
      - name: Check the Worker build
        run: npx --yes wrangler@4.146.0 deploy --dry-run
      - name: Check Worker startup
        run: npx --yes wrangler@4.146.0 check startup --outfile /tmp/worker-startup.cpuprofile
      - name: Post coverage to the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: davelosert/vitest-coverage-report-action@v2

  dependency-audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # No install, lifecycle scripts, package updates, secrets, or new scheduled job.
      # Findings stay visible as "findings"; operational failures still fail this job.
      - name: Read-only audit of production and full dependency graphs
        run: node scripts/audit-dependencies.mjs --report-only --output "$RUNNER_TEMP/dependency-audit"
      - name: Save audit results to the job summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/dependency-audit/audit.md"; then
            cat "$RUNNER_TEMP/dependency-audit/audit.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Full upstream evals run manually. Normal Worker tests include smoke coverage.
  eval-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:eval:full
