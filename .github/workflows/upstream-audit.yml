name: Upstream Audit

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 06:17 JST. Fail when upstream has unintegrated changes.
    - cron: "17 21 * * 0"

permissions:
  contents: read

concurrency:
  group: upstream-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure a read-only upstream remote
        run: |
          git remote add upstream https://github.com/rahilp/second-brain-cloudflare.git
          git config remote.upstream.pushurl DISABLED
      - name: Audit synchronization with upstream Team Edition
        run: npm run upstream:audit
